[project]
name = "uspi-search"
version = "0.1.0"
description = "Hybrid keyword + semantic retrieval for FDA drug labels via openFDA"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "click>=8.1",
    "sentence-transformers>=3.0",
    "chromadb>=0.6",
    "torch",
]

[project.scripts]
ingest   = "uspi_search.ingest:main"
parse    = "uspi_search.parse:main"
embed    = "uspi_search.embed:main"
query    = "uspi_search.query:main"
pipeline = "uspi_search.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uspi_search"]

[tool.uv]
torch-backend = "cu128"

[tool.uv.sources]
torch = { url = "https://download.pytorch.org/whl/cu128/torch-2.11.0%2Bcu128-cp313-cp313-win_amd64.whl", marker = "python_version == '3.13' and sys_platform == 'win32'" }
